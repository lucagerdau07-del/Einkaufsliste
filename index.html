<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einkaufsliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF5EB;
    --card:#FFFFFF;
    --ink:#2B2620;
    --muted:#8A7F70;
    --green:#2E7D44;
    --green-dark:#236233;
    --green-soft:#E7F2EA;
    --amber:#C77B2A;
    --amber-soft:#FBF0DC;
    --line:#EDE4D3;
    --radius:18px;
    --shadow:0 2px 10px rgba(60,45,20,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    font-family:"Nunito",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:18px;
    line-height:1.45;
    padding-bottom:48px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}

  /* Kopfbereich */
  .hero{
    background:linear-gradient(135deg,#2E7D44 0%,#3E9455 60%,#4AA862 100%);
    color:#fff;
    padding:28px 0 22px;
    border-radius:0 0 28px 28px;
    box-shadow:0 4px 18px rgba(46,125,68,.25);
    margin-bottom:20px;
  }
  .hero h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.2px}
  .hero .week{margin:6px 0 16px;opacity:.92;font-size:16px;font-weight:600}
  .progress-meta{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px;margin-bottom:8px}
  .progress-track{background:rgba(255,255,255,.28);border-radius:999px;height:12px;overflow:hidden}
  .progress-fill{background:#fff;border-radius:999px;height:100%;width:0%;transition:width .45s ease}
  .progress-done{display:none;text-align:center;margin-top:14px;font-weight:800;font-size:18px;background:rgba(255,255,255,.18);border-radius:14px;padding:10px}

  /* Kategorie-Karten */
  .cat{margin:0 0 18px}
  .cat-title{
    display:flex;align-items:center;gap:10px;
    font-size:14px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--amber);margin:0 4px 8px;
  }
  .cat-title::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
  .card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;border:1px solid #F1E9D8;
  }

  /* Artikel-Zeile */
  .item{
    display:flex;align-items:center;gap:14px;
    padding:14px 16px;cursor:pointer;user-select:none;
    border-bottom:1px solid var(--line);
    transition:background .15s ease;
    min-height:64px;
  }
  .item:last-child{border-bottom:none}
  .item:active{background:#F7F1E3}
  .check{
    flex:0 0 auto;width:32px;height:32px;border-radius:10px;
    border:2.5px solid #C9BFA9;background:#fff;
    display:flex;align-items:center;justify-content:center;
    transition:all .18s ease;
  }
  .check svg{width:18px;height:18px;opacity:0;transform:scale(.5);transition:all .18s ease}
  .item.done .check{background:var(--green);border-color:var(--green)}
  .item.done .check svg{opacity:1;transform:scale(1)}
  .item-text{flex:1;min-width:0}
  .item-name{font-weight:700;font-size:18px;transition:all .18s ease}
  .item.done .item-name{text-decoration:line-through;color:var(--muted);font-weight:600}
  .amount{
    flex:0 0 auto;font-size:14px;font-weight:800;color:var(--green-dark);
    background:var(--green-soft);border-radius:999px;padding:5px 12px;white-space:nowrap;
  }
  .item.done .amount{opacity:.55}

  /* Nicht-gefunden-Karte */
  .missing{margin-top:26px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid #F1E9D8;padding:20px 18px}
  .missing h2{margin:0 0 6px;font-size:20px;font-weight:800}
  .missing p{margin:0 0 14px;color:var(--muted);font-size:16px}
  .missing-row{display:flex;gap:10px}
  .missing-row input{
    flex:1;min-width:0;font:inherit;font-size:17px;
    border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#FFFDF8;color:var(--ink);
  }
  .missing-row input:focus{outline:none;border-color:var(--amber)}
  .missing-row button{
    font:inherit;font-weight:800;font-size:16px;color:#fff;background:var(--amber);
    border:none;border-radius:14px;padding:12px 18px;cursor:pointer;white-space:nowrap;
    transition:background .15s ease;
  }
  .missing-row button:active{background:#A9681F}
  .missing-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
  .missing-list li{
    background:var(--amber-soft);color:#7A4E15;font-weight:700;font-size:15px;
    border-radius:999px;padding:7px 14px;border:1px dashed #D9B26A;
  }

  .hint{text-align:center;color:var(--muted);font-size:15px;margin:22px 8px 0}
  .state{padding:56px 20px;text-align:center;color:var(--muted);font-size:18px}
  @media (max-width:520px){
    .wrap{padding:0 8px}
    .hero{border-radius:0 0 20px 20px}
    .item{padding:12px 12px;gap:12px}
    .missing{padding:16px 14px}
  }
  .spinner{
    width:44px;height:44px;margin:0 auto 16px;border-radius:50%;
    border:5px solid var(--line);border-top-color:var(--green);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>Einkaufsliste</h1>
    <p class="week" id="weekLabel">Woche wird geladen …</p>
    <div class="progress-meta">
      <span id="progressText">0 von 0 gekauft</span>
      <span id="progressPct">0 %</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-done" id="progressDone">Alles erledigt – super!</div>
  </div>
</header>

<main class="wrap" id="list"></main>

<section class="wrap">
  <div class="missing">
    <h2>Etwas nicht gefunden?</h2>
    <p>Schreib es hier dazu, dann steht es beim nächsten Mal auf der Liste:</p>
    <div class="missing-row">
      <input id="missingInput" type="text" placeholder="z. B. Erdnussbutter" maxlength="80" autocomplete="off">
      <button id="missingBtn" type="button">Dazuschreiben</button>
    </div>
    <ul class="missing-list" id="missingList"></ul>
  </div>
  <p class="hint">Einfach ein Kästchen antippen, wenn du etwas gekauft hast.</p>
</section>

<script>
(function(){
  "use strict";
  var SUPABASE_URL = "https://ouhqnspyueqkadzzjzei.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91aHFuc3B5dWVxa2FkenpqemVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MDA5NzUsImV4cCI6MjA5OTM3Njk3NX0.5aT5ToXCQ_74ojn_JLZ6cPfXJErkzA02fqNym_xOW-0";
  var BASE = SUPABASE_URL + "/rest/v1/einkaufsliste";

  var listEl = document.getElementById("list");
  var weekLabel = document.getElementById("weekLabel");
  var progressText = document.getElementById("progressText");
  var progressPct = document.getElementById("progressPct");
  var progressFill = document.getElementById("progressFill");
  var progressDone = document.getElementById("progressDone");
  var missingInput = document.getElementById("missingInput");
  var missingBtn = document.getElementById("missingBtn");
  var missingList = document.getElementById("missingList");

  function headers(){
    return {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };
  }

  function fmtWeek(w){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(w || "");
    if(!m) return "Diese Woche";
    return "Woche ab " + m[3] + "." + m[2] + "." + m[1];
  }

  function updateProgress(){
    var done = listEl.querySelectorAll(".item.done").length;
    var total = listEl.querySelectorAll(".item").length;
    var pct = total ? Math.round(done/total*100) : 0;
    progressText.textContent = done + " von " + total + " gekauft";
    progressPct.textContent = pct + " %";
    progressFill.style.width = pct + "%";
    progressDone.style.display = (total > 0 && done === total) ? "block" : "none";
  }

  function setStatus(id, status, rowEl){
    rowEl.classList.toggle("done", status === "gekauft");
    updateProgress();
    fetch(BASE + "?id=eq." + id, {
      method: "PATCH",
      headers: headers(),
      body: JSON.stringify({status: status})
    }).catch(function(){});
  }

  function render(rows){
    listEl.innerHTML = "";
    missingList.innerHTML = "";
    if(!rows.length){
      listEl.innerHTML = '<div class="state">Diese Woche steht nichts auf der Liste.</div>';
      weekLabel.textContent = "Diese Woche";
      updateProgress();
      return;
    }
    weekLabel.textContent = fmtWeek(rows[0].woche);

    var groups = {};
    var order = [];
    rows.forEach(function(r){
      if(r.status === "nicht_gefunden") return;
      var k = r.kategorie || "Sonstiges";
      if(!groups[k]){ groups[k] = []; order.push(k); }
      groups[k].push(r);
    });

    order.forEach(function(cat){
      var sec = document.createElement("section");
      sec.className = "cat";
      var title = document.createElement("h2");
      title.className = "cat-title";
      title.textContent = cat;
      sec.appendChild(title);

      var card = document.createElement("div");
      card.className = "card";

      groups[cat].forEach(function(r){
        var row = document.createElement("div");
        var isDone = r.status === "gekauft";
        row.className = "item" + (isDone ? " done" : "");
        row.setAttribute("role","checkbox");
        row.setAttribute("aria-checked", isDone ? "true" : "false");

        var check = document.createElement("span");
        check.className = "check";
        check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

        var txt = document.createElement("div");
        txt.className = "item-text";
        var name = document.createElement("div");
        name.className = "item-name";
        name.textContent = r.item;
        txt.appendChild(name);

        var amt = document.createElement("span");
        amt.className = "amount";
        amt.textContent = r.menge || "";

        row.appendChild(check);
        row.appendChild(txt);
        if(r.menge) row.appendChild(amt);

        row.addEventListener("click", function(){
          var nowDone = !row.classList.contains("done");
          row.setAttribute("aria-checked", nowDone ? "true" : "false");
          setStatus(r.id, nowDone ? "gekauft" : "offen", row);
        });

        card.appendChild(row);
      });

      sec.appendChild(card);
      listEl.appendChild(sec);
    });

    rows.forEach(function(r){
      if(r.status !== "nicht_gefunden") return;
      var li = document.createElement("li");
      li.textContent = r.item;
      missingList.appendChild(li);
    });

    updateProgress();
  }

  function addMissing(){
    var text = missingInput.value.trim();
    if(!text) return;
    missingInput.value = "";
    var li = document.createElement("li");
    li.textContent = text;
    missingList.appendChild(li);
    var week = listEl.dataset.week || "";
    fetch(BASE, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({woche: week, kategorie: "Nicht gefunden", item: text, menge: "", status: "nicht_gefunden"})
    }).catch(function(){});
  }

  missingBtn.addEventListener("click", addMissing);
  missingInput.addEventListener("keydown", function(e){
    if(e.key === "Enter") addMissing();
  });

  listEl.innerHTML = '<div class="state"><div class="spinner"></div>Liste wird geladen …</div>';

  fetch(BASE + "?select=*&order=id", {headers: headers()})
    .then(function(res){
      if(!res.ok) throw new Error("http " + res.status);
      return res.json();
    })
    .then(function(rows){
      listEl.dataset.week = rows.length ? rows[0].woche : "";
      render(rows);
    })
    .catch(function(){
      listEl.innerHTML = '<div class="state">Die Liste konnte nicht geladen werden.<br>Bitte Internetverbindung prüfen und Seite neu laden.</div>';
    });
})();
</script>
</body>
</html>
